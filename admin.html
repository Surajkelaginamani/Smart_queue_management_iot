<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Smart Queue</title>

  <script src="/socket.io/socket.io.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ── Base ── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      flex-wrap: wrap;
      /* cards wrap to next row on narrow screens */
      gap: 24px;
      min-height: 100vh;
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at top right, #1a1c29 0%, #0a0a0f 100%);
      color: #e2e8f0;
    }

    /* ── Cards ── */
    .dashboard-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 24px;
      padding: 32px 28px;
      width: 100%;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
    }

    h2 {
      margin-top: 0;
      font-size: clamp(0.9rem, 3vw, 1.4rem);
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #94a3b8;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 14px;
      margin-bottom: 22px;
    }

    /* ── Status group ── */
    .status-group {
      margin: 12px 0 28px 0;
    }

    .status-label {
      font-size: 0.85rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #adminToken {
      display: block;
      font-size: clamp(3.5rem, 14vw, 5.5rem);
      font-weight: 700;
      margin: 4px 0;
      line-height: 1;
    }

    #adminCustomerName {
      font-size: clamp(1rem, 3.5vw, 1.4rem);
      font-weight: 600;
      color: #38bdf8;
      margin-bottom: 12px;
      min-height: 1.4rem;
    }

    #adminStatus {
      font-size: clamp(0.85rem, 2.5vw, 1.1rem);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      padding: 6px 16px;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.2);
    }

    /* ── Button group ── */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    button {
      font-family: 'Poppins', sans-serif;
      font-size: clamp(0.82rem, 2.4vw, 0.95rem);
      font-weight: 600;
      padding: 14px 12px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      color: white;
      transition: all 0.3s ease;
      letter-spacing: 0.5px;
      touch-action: manipulation;
    }

    button:active {
      transform: scale(0.96);
    }

    .btn-next {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      box-shadow: 0 8px 18px rgba(37, 99, 235, 0.3);
    }

    .btn-next:hover {
      box-shadow: 0 10px 24px rgba(37, 99, 235, 0.5);
    }

    .btn-bump {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      box-shadow: 0 8px 18px rgba(217, 119, 6, 0.3);
    }

    .btn-bump:hover {
      box-shadow: 0 10px 24px rgba(217, 119, 6, 0.5);
    }

    .btn-pause {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      box-shadow: 0 8px 18px rgba(220, 38, 38, 0.3);
    }

    .btn-pause:hover {
      box-shadow: 0 10px 24px rgba(220, 38, 38, 0.5);
    }

    .btn-resume {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      box-shadow: 0 8px 18px rgba(5, 150, 105, 0.3);
      display: none;
    }

    .btn-resume:hover {
      box-shadow: 0 10px 24px rgba(5, 150, 105, 0.5);
    }

    /* ── Queue list ── */
    .queue-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 400px;
      overflow-y: auto;
    }

    .queue-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.3);
      padding: 12px 16px;
      border-radius: 12px;
      border-left: 4px solid #3b82f6;
      text-align: left;
    }

    .queue-item-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: #f8fafc;
    }

    .queue-item-meta {
      font-size: 0.78rem;
      color: #94a3b8;
    }

    .empty-queue {
      color: #94a3b8;
      font-style: italic;
      margin-top: 28px;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.02);
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
    }

    /* ── Responsive: full-width cards on narrow screens ── */
    @media (max-width: 820px) {
      body {
        padding: 16px 12px;
        gap: 16px;
      }

      .dashboard-card {
        max-width: 100%;
        /* span full width on phones */
        padding: 24px 18px;
        border-radius: 18px;
      }

      /* Keep list usable but shorter on phone */
      .queue-list {
        max-height: 260px;
      }
    }
  </style>
</head>

<body>

  <!-- Panel 1: Main Control Center -->
  <div class="dashboard-card">
    <h2>Control Panel</h2>

    <div class="status-group">
      <div class="status-label">Currently Serving</div>
      <div id="adminToken" style="color: #00ff88;">--</div>
      <div id="adminCustomerName">Waiting for students...</div>
      <span id="adminStatus" style="color: #00ff88; border: 1px solid rgba(0, 255, 136, 0.3);">Active</span>
    </div>

    <div class="btn-group">
      <button class="btn-next" onclick="manualNext()">Manual Override: Call Next</button>
      <button class="btn-bump" onclick="socket.emit('adminBump')">No-Show: Bump Down Queue</button>
      <button id="pauseBtn" class="btn-pause" onclick="socket.emit('adminPause')">Pause Queue</button>
      <button id="resumeBtn" class="btn-resume" onclick="socket.emit('adminResume')">Resume Queue</button>
    </div>
  </div>

  <!-- Panel 2: Live Waiting List Visualizer -->
  <div class="dashboard-card">
    <h2>Live Waiting List</h2>
    <div id="queueListContainer" class="queue-list">
      <div class="empty-queue">No one is currently waiting.</div>
    </div>
  </div>

  <script>
    const serverUrl = window.location.origin;
    const socket = io(serverUrl);

    async function manualNext() {
      try {
        await fetch(`${serverUrl}/increment`, { method: 'POST' });
      } catch (err) {
        alert("Failed to communicate with server.");
      }
    }

    socket.on('stateUpdated', (state) => {
      const tokenEl = document.getElementById('adminToken');
      const nameEl = document.getElementById('adminCustomerName');
      const statusEl = document.getElementById('adminStatus');
      const pauseBtn = document.getElementById('pauseBtn');
      const resumeBtn = document.getElementById('resumeBtn');
      const listContainer = document.getElementById('queueListContainer');

      tokenEl.innerText = state.currentlyServing > 0 ? state.currentlyServing : '--';
      nameEl.innerText = state.currentlyServing > 0
        ? (state.currentlyServingName || 'Student')
        : 'Waiting for students...';

      if (state.isPaused) {
        tokenEl.style.color = "#ff4444";
        statusEl.innerText = "PAUSED";
        statusEl.style.color = "#ff4444";
        statusEl.style.borderColor = "rgba(255, 68, 68, 0.3)";
        pauseBtn.style.display = "none";
        resumeBtn.style.display = "block";
      } else {
        tokenEl.style.color = "#00ff88";
        statusEl.innerText = "ACTIVE";
        statusEl.style.color = "#00ff88";
        statusEl.style.borderColor = "rgba(0, 255, 136, 0.3)";
        pauseBtn.style.display = "block";
        resumeBtn.style.display = "none";
      }

      listContainer.innerHTML = '';
      if (!state.waitingList || state.waitingList.length === 0) {
        listContainer.innerHTML = '<div class="empty-queue">No one is currently waiting.</div>';
      } else {
        state.waitingList.forEach((user, index) => {
          listContainer.innerHTML += `
            <div class="queue-item">
              <div>
                <div class="queue-item-name">${user.name}</div>
                <div class="queue-item-meta">Token #${user.token}</div>
              </div>
              <span style="font-size: 0.85rem; color: #38bdf8; font-weight: 500;">Pos: ${index + 1}</span>
            </div>
          `;
        });
      }
    });
  </script>
</body>

</html>
