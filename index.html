<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Queue - Portal Directory</title>
  
  <!-- Google Font: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background-color: #0f172a;
      background-image: 
        radial-gradient(circle at 20% 15%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 85%, rgba(168, 85, 247, 0.08) 0%, transparent 40%);
      font-family: 'Poppins', sans-serif;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient background glow effects */
    .ambient-glow {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      filter: blur(100px);
      z-index: 0;
      pointer-events: none;
      opacity: 0.4;
    }

    .glow-1 {
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(16, 185, 129, 0.15);
    }

    /* Glassmorphism Hub Card */
    .hub-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      padding: 44px 32px;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.55),
                  inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    .brand-badge .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #10b981;
      box-shadow: 0 0 10px #10b981;
    }

    h1 {
      font-size: clamp(1.6rem, 5vw, 2rem);
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 0.92rem;
      color: #94a3b8;
      margin-bottom: 34px;
      line-height: 1.5;
    }

    /* Button Navigation Group */
    .nav-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
    }

    .portal-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 16px 20px;
      border-radius: 16px;
      text-decoration: none;
      color: #ffffff;
      font-weight: 600;
      font-size: 1rem;
      box-sizing: border-box;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      border: 1px solid transparent;
    }

    .portal-btn:active {
      transform: scale(0.97);
    }

    .btn-content {
      display: flex;
      align-items: center;
      gap: 14px;
      text-align: left;
    }

    .btn-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.2);
      flex-shrink: 0;
    }

    .btn-icon svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .btn-text {
      display: flex;
      flex-direction: column;
    }

    .btn-title {
      font-size: 0.98rem;
      font-weight: 600;
      line-height: 1.25;
    }

    .btn-desc {
      font-size: 0.78rem;
      font-weight: 400;
      opacity: 0.85;
      margin-top: 2px;
    }

    .btn-arrow {
      opacity: 0.8;
      transition: transform 0.3s ease;
      display: flex;
      align-items: center;
    }

    .btn-arrow svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .portal-btn:hover .btn-arrow {
      transform: translateX(4px);
      opacity: 1;
    }

    /* 1. Student Mobile Portal - Green Gradient */
    .btn-student {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.35);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .btn-student:hover {
      box-shadow: 0 14px 30px rgba(16, 185, 129, 0.5);
      transform: translateY(-2px);
    }

    /* 2. Admin Dashboard - Blue Gradient */
    .btn-admin {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.35);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .btn-admin:hover {
      box-shadow: 0 14px 30px rgba(37, 99, 235, 0.5);
      transform: translateY(-2px);
    }

    /* 3. Public TV Display - Purple Gradient */
    .btn-display {
      background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
      box-shadow: 0 10px 25px rgba(168, 85, 247, 0.35);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .btn-display:hover {
      box-shadow: 0 14px 30px rgba(168, 85, 247, 0.5);
      transform: translateY(-2px);
    }

    /* Footer meta */
    .hub-footer {
      margin-top: 32px;
      font-size: 0.78rem;
      color: #64748b;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div class="ambient-glow glow-1"></div>

  <div class="hub-card">
    <div class="brand-badge">
      <span class="pulse-dot"></span>
      Smart Queue System
    </div>

    <h1>Navigation Hub</h1>
    <p class="subtitle">Select a portal below to access queue services, administration, or live displays.</p>

    <div class="nav-group">
      <!-- 1. Student Mobile Portal (Green gradient) -->
      <a href="/mobile.html" class="portal-btn btn-student" id="btnStudentPortal">
        <div class="btn-content">
          <div class="btn-icon">
            <svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>
          </div>
          <div class="btn-text">
            <span class="btn-title">Student Mobile Portal</span>
            <span class="btn-desc">Join queue & track status</span>
          </div>
        </div>
        <div class="btn-arrow">
          <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </div>
      </a>

      <!-- 2. Admin Dashboard (Blue gradient) -->
      <a href="/admin.html" class="portal-btn btn-admin" id="btnAdminDashboard">
        <div class="btn-content">
          <div class="btn-icon">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
          </div>
          <div class="btn-text">
            <span class="btn-title">Admin Dashboard</span>
            <span class="btn-desc">Manage calls, pause & bump</span>
          </div>
        </div>
        <div class="btn-arrow">
          <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </div>
      </a>

      <!-- 3. Public TV Display (Purple gradient) -->
      <a href="/display.html" class="portal-btn btn-display" id="btnTvDisplay">
        <div class="btn-content">
          <div class="btn-icon">
            <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect><polyline points="17 2 12 7 7 2"></polyline></svg>
          </div>
          <div class="btn-text">
            <span class="btn-title">Public TV Display</span>
            <span class="btn-desc">Full-screen "Now Serving" board</span>
          </div>
        </div>
        <div class="btn-arrow">
          <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </div>
      </a>
    </div>

    <div class="hub-footer">
      Connected &bull; IoT Queue Management
    </div>
  </div>

</body>
</html>
